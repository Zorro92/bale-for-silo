name: CI

# Documentation-only changes build nothing. scripts/deploy-xbox.sh mirrors these paths to find the
# build of a docs-only HEAD.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.claude/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.claude/**']
  workflow_dispatch:
    inputs:
      production:
        description: Also build the production (debug server off) package
        type: boolean
        default: false

permissions:
  contents: read

# A newer push makes an in-flight build of the same branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check shared card rail layouts
        run: python3 scripts/check-rail-layout.py
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet test tests/Bale.Core.Tests --configuration Release
      - run: dotnet build tools/Bale.Cli --configuration Release

  grain:
    name: Rust grain (Linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: native/bale-gpu
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust lint components
        run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --release --locked

  rust-windows:
    name: Rust GPU layer (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7

      # libass with FreeType, FriBidi and HarfBuzz: static, UWP app partition, linked into bale_gpu.dll.
      # Rebuilt only when the pin or the build script changes.
      - name: Restore libass build
        id: libass
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\.libass
          key: libass-uwp-x64-${{ hashFiles('scripts/libass-native.json', 'scripts/build-libass-native.ps1') }}

      - name: Build libass (static, UWP app partition)
        if: steps.libass.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-libass-native.ps1 -OutDir '${{ github.workspace }}\.libass'

      - name: Point the Rust layer at libass
        shell: pwsh
        run: |
          "BALE_LIBASS_DIR=${{ github.workspace }}\.libass" >> $env:GITHUB_ENV

      # Rust GPU/media layer: static CRT (native/bale-gpu/.cargo/config.toml), packaged by the csproj.
      - name: Locate Windows shader compiler
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is required for real grain shaders' }
          "FXC=$($fxc.FullName)" >> $env:GITHUB_ENV

      # Compiled dependencies (windows-rs above all). The key changes only with the lockfile, manifest,
      # cargo config or rustc, so it is saved once per combination; Bale's own crate is rebuilt every run.
      - name: Rust cache key
        id: rust
        shell: pwsh
        run: |
          "key=cargo-windows-test-$((rustc -V) -replace '[^0-9A-Za-z.]', '-')-${{ hashFiles('native/bale-gpu/Cargo.lock', 'native/bale-gpu/Cargo.toml', 'native/bale-gpu/.cargo/config.toml') }}" >> $env:GITHUB_OUTPUT

      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            native/bale-gpu/target
          key: ${{ steps.rust.outputs.key }}

      - name: Lint Rust GPU layer (Windows)
        shell: pwsh
        run: |
          rustup component add clippy
          rustup target add x86_64-pc-windows-msvc
          Push-Location native/bale-gpu
          cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
          $cargoExit = $LASTEXITCODE
          Pop-Location
          if ($cargoExit -ne 0) { throw 'cargo clippy failed' }

      - name: Test Rust GPU layer
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          # Run inside the crate so cargo reads .cargo/config.toml, including the static CRT setting.
          Push-Location native/bale-gpu
          cargo test --release --locked --target x86_64-pc-windows-msvc -- --nocapture
          $cargoExit = $LASTEXITCODE
          Pop-Location
          if ($cargoExit -ne 0) { throw 'cargo test failed' }

      - name: Save Rust build cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            native/bale-gpu/target
          key: ${{ steps.rust.outputs.key }}

  xbox:
    name: Xbox package (Windows, debug=${{ matrix.debug_server }})
    strategy:
      fail-fast: false
      matrix:
        # Bale is in a build/debug phase: pushes and PRs build only the debug-server package.
        # Run this workflow manually with production=true to also build and check production.
        debug_server: ${{ fromJSON(inputs.production && '["true", "false"]' || '["true"]') }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      # The runner image already ships a .NET 10 SDK; global.json picks it, so no setup-dotnet download.
      - uses: microsoft/setup-msbuild@v3

      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\.nuget\packages
          key: nuget-windows-${{ hashFiles('**/*.csproj', '**/packages.lock.json', 'Directory.Build.props', 'global.json', 'NuGet.Config', 'scripts/ffmpeg-native.json', 'scripts/ffmpeginteropx-wrapper.json') }}
          restore-keys: nuget-windows-

      - name: Test native package validation scripts
        shell: pwsh
        run: |
          ./scripts/test-ffmpeg-checks.ps1
          ./scripts/test-ffmpeginteropx-wrapper.ps1

      - name: Download and verify pinned FFmpeg native and wrapper packages
        shell: pwsh
        run: ./scripts/restore-ffmpeg-native.ps1

      # libass with FreeType, FriBidi and HarfBuzz: static, UWP app partition, linked into bale_gpu.dll.
      # Rebuilt only when the pin or the build script changes.
      - name: Restore libass build
        id: libass
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\.libass
          key: libass-uwp-x64-${{ hashFiles('scripts/libass-native.json', 'scripts/build-libass-native.ps1') }}

      - name: Build libass (static, UWP app partition)
        if: steps.libass.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-libass-native.ps1 -OutDir '${{ github.workspace }}\.libass'

      - name: Point the Rust layer at libass
        shell: pwsh
        run: |
          "BALE_LIBASS_DIR=${{ github.workspace }}\.libass" >> $env:GITHUB_ENV

      # Rust GPU/media layer: static CRT (native/bale-gpu/.cargo/config.toml), packaged by the csproj.
      - name: Locate Windows shader compiler
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is required for real grain shaders' }
          "FXC=$($fxc.FullName)" >> $env:GITHUB_ENV

      # Compiled dependencies (windows-rs above all). The key changes only with the lockfile, manifest,
      # cargo config or rustc, so it is saved once per combination; Bale's own crate is rebuilt every run.
      - name: Rust cache key
        id: rust
        shell: pwsh
        run: |
          "key=cargo-windows-build-$((rustc -V) -replace '[^0-9A-Za-z.]', '-')-${{ hashFiles('native/bale-gpu/Cargo.lock', 'native/bale-gpu/Cargo.toml', 'native/bale-gpu/.cargo/config.toml') }}" >> $env:GITHUB_OUTPUT

      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            native/bale-gpu/target
          key: ${{ steps.rust.outputs.key }}

      - name: Build Rust GPU layer
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          # Run inside the crate: cargo reads .cargo/config.toml (static CRT) from the working directory,
          # not from --manifest-path.
          Push-Location native/bale-gpu
          cargo build --release --locked --target x86_64-pc-windows-msvc
          $cargoExit = $LASTEXITCODE
          Pop-Location
          if ($cargoExit -ne 0) { throw 'cargo build failed' }
          $dll = 'native/bale-gpu/target/x86_64-pc-windows-msvc/release/bale_gpu.dll'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          # Imported DLLs, for checking against what the Xbox app container provides.
          & $dumpbin.FullName /dependents $dll
          if ((& $dumpbin.FullName /dependents $dll) -match 'vcruntime140\.dll|msvcp140\.dll') { throw 'bale_gpu.dll must link the CRT statically' }

      - name: Save Rust build cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            native/bale-gpu/target
          key: ${{ steps.rust.outputs.key }}

      # Every build gets a higher version so the Xbox accepts it as an update.
      - name: Stamp version
        shell: pwsh
        run: |
          $path = Resolve-Path 'src/Bale.Xbox/Package.appxmanifest'
          [xml]$manifest = Get-Content $path
          $manifest.Package.Identity.Version = "0.1.${{ github.run_number }}.0"
          $manifest.Save($path)

      # Throwaway certificate for sideloading, left in the runner's store for the build to sign with.
      # The deploy script installs Bale.cer on the console.
      - name: Create signing certificate
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Bale Development' `
            -KeyUsage DigitalSignature -FriendlyName 'Bale Development' `
            -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddYears(1) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          New-Item -ItemType Directory -Force out | Out-Null
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Export-Certificate -Cert $cert -FilePath out\Bale.cer | Out-Null

      - name: Build MSIX
        run: >
          msbuild src/Bale.Xbox/Bale.Xbox.csproj /restore /m /v:minimal
          /p:Configuration=Release /p:Platform=x64
          /p:BaleDebugServer=${{ matrix.debug_server }}
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageDir=${{ github.workspace }}\out\
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }}

      - name: Check FFmpeg native activation and package contents
        shell: pwsh
        run: |
          $package = Get-ChildItem out -Recurse -Filter '*.msix' |
            Where-Object { $_.FullName -notmatch '[\\/]Dependencies[\\/]' } | Select-Object -First 1
          if (-not $package) { throw 'No application MSIX found' }
          ./scripts/check-ffmpeg-package.ps1 -PackagePath $package.FullName
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          $inspection = Join-Path $env:RUNNER_TEMP "bale-gpu-exports-$([guid]::NewGuid())"
          New-Item -ItemType Directory $inspection | Out-Null
          $packagedDll = Join-Path $inspection 'bale_gpu.dll'
          try {
            try {
              $entry = $zip.GetEntry('bale_gpu.dll')
              if (-not $entry) { throw 'bale_gpu.dll missing from the MSIX' }
              foreach ($name in 'libass', 'freetype', 'fribidi', 'harfbuzz', 'SOURCES') {
                if (-not $zip.GetEntry("Licenses/libass/$name.txt")) { throw "Licenses/libass/$name.txt missing from the MSIX" }
              }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $packagedDll)
            } finally { $zip.Dispose() }
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = & $vswhere -latest -products * -property installationPath
            $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
              Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
            if (-not $dumpbin) { throw 'dumpbin.exe is required to inspect the packaged bale_gpu.dll' }
            $exports = & $dumpbin.FullName /exports $packagedDll
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect packaged bale_gpu.dll exports' }
            # Live exports: the wrapper's grain and zero-copy loaders (patch 0020), and the app's P/Invokes.
            $required = @('bale_grain_abi_version', 'bale_grain_validate',
              'bale_grain_gpu_create', 'bale_grain_gpu_apply', 'bale_grain_gpu_destroy', 'bale_grain_gpu_probe',
              'bale_zc_abi_version', 'bale_zc_register_d3d12', 'bale_zc_create', 'bale_zc_alloc', 'bale_zc_release',
              'bale_zc_repack', 'bale_zc_repack_into', 'bale_zc_repack_into_bits', 'bale_zc_stats', 'bale_zc_destroy',
              'bale_gpu_abi_version', 'bale_gpu_std_probe', 'bale_gpu_d3d11_probe',
              'bale_gpu_engine_probe', 'bale_gpu_engine_probe_source', 'bale_ass_probe', 'bale_ass_probe_png',
              'bale_frame_observer_create', 'bale_frame_observer_mark', 'bale_frame_observer_drain',
              'bale_frame_observer_status', 'bale_frame_observer_video_descriptor', 'bale_frame_observer_destroy')
            # Removed with the staging upload, CPU grain, debug repack and upload/zero-copy probes.
            $removed = @('bale_grain_cpu_apply', 'bale_repack_abi_version', 'bale_repack_gpu_create',
              'bale_repack_gpu_apply', 'bale_repack_gpu_destroy',
              'bale_gpu_upload_probe', 'bale_gpu_d3d12_probe', 'bale_gpu_zero_copy_probe')
            foreach ($symbol in $required) {
              if (-not ($exports | Select-String -Pattern "\s$([regex]::Escape($symbol))\s*$" -Quiet)) {
                throw "Packaged bale_gpu.dll is missing export $symbol"
              }
            }
            foreach ($symbol in $removed) {
              if ($exports | Select-String -Pattern "\s$([regex]::Escape($symbol))\s*$" -Quiet) {
                throw "Packaged bale_gpu.dll still exports removed $symbol"
              }
            }
            Write-Output "Packaged bale_gpu.dll: $($required.Count) live exports present, $($removed.Count) removed exports absent"
          } finally { Remove-Item $inspection -Recurse -Force }

      - uses: actions/upload-artifact@v7
        with:
          name: bale-xbox-x64${{ matrix.debug_server == 'false' && '-production' || '' }}
          path: out/
          if-no-files-found: error
