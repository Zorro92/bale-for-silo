name: AV1 GPU test player

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_URL: https://aomedia.googlesource.com/av1-xbox-one
  UPSTREAM_COMMIT: b5c61563b48625c261a8d627cfa928896fd10b13

# An isolated upstream experiment: no Bale build, package, pin or release changes.
jobs:
  player:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PLATFORM_TOOLSET: v145
      WINDOWS_SDK: 10.0.26100.0
    steps:
      - uses: actions/checkout@v7
        with:
          path: bale
          persist-credentials: false

      - name: Fetch pinned upstream and apply LocalState patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out | Out-Null
          # Fetch the exact commit, not a movable branch; disable Windows checkout newline conversion.
          git -c core.autocrlf=false init upstream
          if ($LASTEXITCODE -ne 0) { throw 'Upstream repository initialization failed' }
          git -C upstream remote add origin $env:UPSTREAM_URL
          if ($LASTEXITCODE -ne 0) { throw 'Upstream remote configuration failed' }
          git -C upstream -c core.autocrlf=false fetch --depth 1 origin $env:UPSTREAM_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Pinned upstream fetch failed' }
          git -C upstream -c core.autocrlf=false checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Pinned upstream checkout failed' }
          $commit = git -C upstream rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -cne $env:UPSTREAM_COMMIT) { throw 'Upstream commit mismatch' }
          $patches = @(Get-ChildItem bale/scripts/av1-gpu-testplayer/*.patch | Sort-Object Name)
          if (-not $patches.Count) { throw 'No experiment patches found' }
          $sources = @(
            "Upstream: $env:UPSTREAM_URL",
            "Commit: $commit",
            "Build recipe: $env:GITHUB_SHA",
            "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Build: Release x64; PlatformToolset=$env:PLATFORM_TOOLSET; Windows SDK=$env:WINDOWS_SDK",
            'Patches (filename SHA256):'
          )
          foreach ($patch in $patches) {
            git -C upstream apply --check $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch check failed: $($patch.Name)" }
            git -C upstream apply $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch application failed: $($patch.Name)" }
            $sources += "$($patch.Name) $((Get-FileHash $patch.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
          }
          $sources | Set-Content out/SOURCES.txt -Encoding utf8
          # Binary redistribution retains the BSD notices and AOM patent license, including libwebm.
          foreach ($license in @('LICENSE.txt', 'libav1/LICENSE', 'libav1/PATENTS',
              'third_party/libwebm/LICENSE.TXT', 'third_party/libwebm/PATENTS.TXT')) {
            $destination = Join-Path out/licenses $license
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Copy-Item (Join-Path upstream $license) $destination
          }

      # Codegen evidence for patch 0003, which cannot be measured without a console: both CDEF
      # shaders through the FXC, profile and flags of the Release x64 project (cs_5_0, entry
      # main, default optimization). A shader that does not compile stops the run here.
      - name: Disassemble the original and the v2 CDEF shader
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fxc = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin\$env:WINDOWS_SDK\x64\fxc.exe"
          if (-not (Test-Path $fxc)) { throw "fxc.exe of Windows SDK $env:WINDOWS_SDK not found" }
          $directory = (New-Item -ItemType Directory -Force out/cdef-shaders).FullName
          $stats = @("FXC of Windows SDK $env:WINDOWS_SDK: /T cs_5_0 /E main, default optimization (the Release x64 project settings).",
            'Counts are static: instructions in the listing, not instructions executed.')
          foreach ($name in @('cdef_filter', 'cdef_filter_v2')) {
            $listing = Join-Path $directory "$name.asm"
            $ErrorActionPreference = 'Continue'
            $output = & $fxc /nologo /T cs_5_0 /E main /Vn $name /Fc $listing /Fh (Join-Path $directory "$name.h") `
              "upstream/libav1/dx/shaders/$name.hlsl" 2>&1 | ForEach-Object { "$_" }
            $exit = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            $output | Write-Host
            if ($exit -ne 0) { throw "FXC failed for $name.hlsl" }
            $text = @(Get-Content $listing)
            $code = @($text | Where-Object { $_ -notmatch '^\s*(//|$)' })
            $indexable = @($code | Where-Object { $_ -match '^\s*dcl_indexableTemp' } | ForEach-Object { $_.Trim() })
            $shared = @($code | Where-Object { $_ -match '^\s*dcl_tgsm_' } | ForEach-Object { $_.Trim() })
            $sharedBytes = 0
            foreach ($declaration in $shared) {
              $numbers = @([regex]::Matches(($declaration -replace '^\S+\s+g\d+', ''), '\d+') | ForEach-Object { [int]$_.Value })
              $sharedBytes += if ($declaration -match 'structured') { $numbers[0] * $numbers[1] } else { $numbers[0] }
            }
            $slots = ($text | Select-String -Pattern 'Approximately (\d+) instruction slots used' | Select-Object -First 1).Matches.Groups[1].Value
            $stats += @('', "== $name.hlsl ==",
              "thread group:                           $((@($code -match '^\s*dcl_thread_group') -join '').Trim())",
              "instruction slots:                      $slots",
              "temp registers:                         $((@($code -match '^\s*dcl_temps') -join '').Trim())",
              "indexable temps:                        $($indexable.Count)")
            $stats += @($indexable | ForEach-Object { "    $_" })
            $stats += @(
              "instructions using an indexable temp:   $(@($code -match '\bx\d+\[').Count)",
              "immediate constant buffer:              $(if (@($code -match 'dcl_immediateConstantBuffer').Count) { 'yes' } else { 'no' })",
              "instructions reading it (icb):          $(@($code -match '\bicb\[').Count)",
              "groupshared declarations:               $($shared.Count), $sharedBytes bytes")
            $stats += @($shared | ForEach-Object { "    $_" })
            $stats += @(
              "group barriers (sync):                  $(@($code -match '^\s*sync').Count)",
              "groupshared loads / stores:             $(@($code -match '^\s*ld_(raw|structured)\S*\s.*\bg\d').Count) / $(@($code -match '^\s*store_(raw|structured)\S*\s+g\d').Count)",
              "buffer loads / stores:                  $(@($code -match '^\s*ld_(raw|structured)\S*\s.*\b[tu]\d').Count) / $(@($code -match '^\s*store_(raw|structured)\S*\s+u\d').Count)",
              "loops:                                  $(@($code -match '^\s*loop\b').Count)")
          }
          $stats | Set-Content (Join-Path $directory 'stats.txt') -Encoding utf8
          @('## CDEF shader listings', '```') + $stats + @('```') >> $env:GITHUB_STEP_SUMMARY

      # Match the wrapper workflow's MSBuild selection, toolset and SDK (not upstream v141/17763).
      - uses: microsoft/setup-msbuild@v3

      - name: Create sideload certificate and stamp experiment identity
        id: cert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Bale Development' `
            -KeyUsage DigitalSignature -FriendlyName 'AV1 GPU Test Player Development' `
            -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddYears(1) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Export-Certificate -Cert $cert -FilePath out/Av1GpuTestPlayer.cer | Out-Null
          $path = Resolve-Path upstream/testing/uwp_dx12_player/Package.appxmanifest
          [xml]$manifest = Get-Content $path -Raw
          $manifest.Package.Identity.Name = 'Av1GpuTestPlayer'
          $manifest.Package.Identity.Publisher = $cert.Subject
          $manifest.Package.Identity.Version = "0.1.$env:GITHUB_RUN_NUMBER.0"
          $manifest.Package.Properties.DisplayName = 'AV1 GPU Test Player'
          $manifest.Package.Properties.PublisherDisplayName = 'Bale Development'
          $manifest.Package.Applications.Application.VisualElements.DisplayName = 'AV1 GPU Test Player'
          $manifest.Package.Applications.Application.VisualElements.Description = 'Experimental upstream D3D12 compute AV1 player'
          $manifest.Save($path)

      - name: Build signed Release x64 sideload package
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          # /sdl promotes upstream's deprecated GetDesktopDpi call to C4996 even without /WX.
          # _CL_ appends this override after the project's compiler options; no source patch is needed.
          _CL_: /wd4996
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'out/packages/'
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'out/msbuild.log'
          # Building the solution supplies SolutionDir to the shader/include paths and builds all three projects.
          # Clear the upstream committed PFX: signing must use only this run's certificate in the store.
          & MSBuild.exe upstream/av1xbox.sln /m /v:minimal /p:Configuration=Release /p:Platform=x64 `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET" "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK" `
            /p:WindowsTargetPlatformMinVersion=10.0.17763.0 /p:TreatWarningAsError=false `
            /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never /p:AppxPackageExtension=.msix "/p:AppxPackageDir=$packageDirectory" `
            /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile= `
            "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT" `
            /fl "/flp:logfile=$buildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'Upstream Release x64 player build/package failed; see msbuild.log' }
          $packages = @(Get-ChildItem out/packages -Recurse -File | Where-Object {
            $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle') -and
            $_.FullName -notmatch '[\\/]Dependencies[\\/]'
          })
          if (-not $packages.Count) { throw 'No application sideload package was produced' }
          # The listings describe the shipped shaders only if the build compiled the same bytecode.
          foreach ($name in @('cdef_filter', 'cdef_filter_v2')) {
            $listed = Join-Path out/cdef-shaders "$name.h"
            $bytecode = @($listed, "upstream/libav1/dx/shaders/h/$name.h") | ForEach-Object {
              $text = Get-Content $_ -Raw
              $start = $text.IndexOf('const BYTE')
              if ($start -lt 0) { throw "No bytecode array in $_" }
              $text.Substring($start) -replace '\s+', ' '
            }
            if ($bytecode[0] -cne $bytecode[1]) { throw "$name.asm does not match the shader in the build" }
            Remove-Item $listed
            "$name.asm: same bytecode header as the one compiled into the package" | Add-Content out/cdef-shaders/stats.txt -Encoding utf8
          }
          @('## AV1 GPU test player', '', 'Experimental upstream build only; no console performance claim.', '',
            '### Artifact files', '```') +
            @(Get-ChildItem out -Recurse -File | ForEach-Object { [IO.Path]::GetRelativePath((Resolve-Path out), $_.FullName) }) +
            @('```') >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve package, certificate, dependencies, licenses, shader listings and build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: av1-gpu-testplayer-x64-${{ github.run_id }}
          path: out/
          if-no-files-found: warn

  # Host proof for patch 0003: the original and the v2 CDEF shader source, compiled as C++,
  # must write byte-identical frames (random and edge-case input, 8-bit and high bit depth).
  cdef-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: bale
          persist-credentials: false

      - name: Fetch pinned upstream and apply patches
        run: |
          set -euo pipefail
          git init -q upstream
          git -C upstream remote add origin "$UPSTREAM_URL"
          git -C upstream fetch -q --depth 1 origin "$UPSTREAM_COMMIT"
          git -C upstream checkout -q --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          for patch in bale/scripts/av1-gpu-testplayer/*.patch; do
            git -C upstream apply "$GITHUB_WORKSPACE/$patch"
          done

      - name: Compare cdef_filter_v2.hlsl with cdef_filter.hlsl
        run: |
          set -euo pipefail
          sh upstream/testing/cdef_check/run.sh --mutate | tee cdef-check.log
          { echo '## CDEF bit-exactness check'; echo '```'; tail -n 4 cdef-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
