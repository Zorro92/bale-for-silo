name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      production:
        description: Also build the production (debug server off) package
        type: boolean
        default: false

permissions:
  contents: read

# A newer push makes an in-flight build of the same branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check shared card rail layouts
        run: python3 scripts/check-rail-layout.py
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet test tests/Bale.Core.Tests --configuration Release
      - run: dotnet build tools/Bale.Cli --configuration Release

  xbox:
    name: Xbox package (Windows, debug=${{ matrix.debug_server }})
    strategy:
      fail-fast: false
      matrix:
        # Bale is in a build/debug phase: pushes and PRs build only the debug-server package.
        # Run this workflow manually with production=true to also build and check production.
        debug_server: ${{ fromJSON(inputs.production && '["true", "false"]' || '["true"]') }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
    steps:
      - uses: actions/checkout@v7
      # The runner image already ships a .NET 10 SDK; global.json picks it, so no setup-dotnet download.
      - uses: microsoft/setup-msbuild@v3

      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\.nuget\packages
          key: nuget-windows-${{ hashFiles('**/*.csproj', '**/packages.lock.json', 'Directory.Build.props', 'global.json', 'NuGet.Config', 'scripts/ffmpeg-native.json', 'scripts/ffmpeginteropx-wrapper.json') }}
          restore-keys: nuget-windows-

      - name: Test native package validation scripts
        shell: pwsh
        run: |
          ./scripts/test-ffmpeg-checks.ps1
          ./scripts/test-ffmpeginteropx-wrapper.ps1

      - name: Download and verify pinned FFmpeg native and wrapper packages
        shell: pwsh
        run: ./scripts/restore-ffmpeg-native.ps1

      # Rust GPU/media layer: static CRT (native/bale-gpu/.cargo/config.toml), packaged by the csproj.
      - name: Test Rust GPU layer
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          # Run inside the crate so cargo reads .cargo/config.toml, including the static CRT setting.
          Push-Location native/bale-gpu
          cargo test --release --locked --target x86_64-pc-windows-msvc
          $cargoExit = $LASTEXITCODE
          Pop-Location
          if ($cargoExit -ne 0) { throw 'cargo test failed' }

      - name: Build Rust GPU layer
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          # Run inside the crate: cargo reads .cargo/config.toml (static CRT) from the working directory,
          # not from --manifest-path.
          Push-Location native/bale-gpu
          cargo build --release --locked --target x86_64-pc-windows-msvc
          $cargoExit = $LASTEXITCODE
          Pop-Location
          if ($cargoExit -ne 0) { throw 'cargo build failed' }
          $dll = 'native/bale-gpu/target/x86_64-pc-windows-msvc/release/bale_gpu.dll'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          # Imported DLLs, for checking against what the Xbox app container provides.
          & $dumpbin.FullName /dependents $dll
          if ((& $dumpbin.FullName /dependents $dll) -match 'vcruntime140\.dll|msvcp140\.dll') { throw 'bale_gpu.dll must link the CRT statically' }

      # Every build gets a higher version so the Xbox accepts it as an update.
      - name: Stamp version
        shell: pwsh
        run: |
          $path = Resolve-Path 'src/Bale.Xbox/Package.appxmanifest'
          [xml]$manifest = Get-Content $path
          $manifest.Package.Identity.Version = "0.1.${{ github.run_number }}.0"
          $manifest.Save($path)

      # Throwaway certificate for sideloading, left in the runner's store for the build to sign with.
      # The deploy script installs Bale.cer on the console.
      - name: Create signing certificate
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Bale Development' `
            -KeyUsage DigitalSignature -FriendlyName 'Bale Development' `
            -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddYears(1) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          New-Item -ItemType Directory -Force out | Out-Null
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Export-Certificate -Cert $cert -FilePath out\Bale.cer | Out-Null

      - name: Build MSIX
        run: >
          msbuild src/Bale.Xbox/Bale.Xbox.csproj /restore /m /v:minimal
          /p:Configuration=Release /p:Platform=x64
          /p:BaleDebugServer=${{ matrix.debug_server }}
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageDir=${{ github.workspace }}\out\
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }}

      - name: Check FFmpeg native activation and package contents
        shell: pwsh
        run: |
          $package = Get-ChildItem out -Recurse -Filter '*.msix' |
            Where-Object { $_.FullName -notmatch '[\\/]Dependencies[\\/]' } | Select-Object -First 1
          if (-not $package) { throw 'No application MSIX found' }
          ./scripts/check-ffmpeg-package.ps1 -PackagePath $package.FullName
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try { if (-not $zip.GetEntry('bale_gpu.dll')) { throw 'bale_gpu.dll missing from the MSIX' } } finally { $zip.Dispose() }

      - uses: actions/upload-artifact@v7
        with:
          name: bale-xbox-x64${{ matrix.debug_server == 'false' && '-production' || '' }}
          path: out/
          if-no-files-found: error
