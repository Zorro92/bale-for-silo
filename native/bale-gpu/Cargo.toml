[package]
name = "bale-gpu"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Bale's native GPU/media layer for Xbox (C ABI for the C# app)"
publish = false

[features]
# Only development packages opt in; independent of Rust optimisation/debug assertions.
stage-timing = []
# Debug-server packages only (ci.yml builds them with stage-timing): the debug server's probes and readouts, no
# production caller in the app or the FFmpegInteropX fork. The std/D3D11/engine/libass/grain/audio probes, the audio
# Initialize variants, the tone-map churn and peak readout, D3D11 device release counts, the memory ledger readout,
# memprobe and the engine session frame log. CI requires them in debug-server DLLs and refuses them in production ones.
debug-probes = []

[lib]
name = "bale_gpu"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
# #[implement] expands to windows_core paths.
windows-core = "0.62.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Foundation",
    "Media_Core",
    # MediaDevice's default render id: the exclusive-mode audio output (audio_out/) and the debug passthrough probe.
    "Media_Devices",
    "Media_Playback",
    "Media_MediaProperties",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    # Zero-copy repack; d3d12.dll is loaded by the caller, never imported.
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # IAudioClient: the audio output (audio_out/) and the debug probe. mmdevapi.dll is loaded by the caller, never imported.
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    # Zero-copy repack: D3D12/DXGI shared handles and events take SECURITY_ATTRIBUTES.
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Grain exports catch panics; unwinding must remain enabled, including in the shipped DLL.
panic = "unwind"

[dev-dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
