[package]
name = "bale-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Bale's platform-independent playback logic (C ABI for Bale.Core)"
publish = false

[features]
# Debug-server builds only (ci.yml), and the Linux library the .NET tests load, since they run the debug server's
# code: the media fault switch (bale-debug.sh media-fault, media_fault.rs: the outage hook and empty tail) and the HTTP
# probe (http_probe.rs). Production bale_core.dll has neither JSON call; CI checks the packaged DLL.
debug-probes = []

[lib]
name = "bale_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact float parsing; the default fast path can be one ULP off, so a double
# could differ from the one C# sent (seen with large exponents in BaleCoreNativeTests).
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
# .NET's regex \d/\w and char.IsLetterOrDigit follow Unicode general categories (dotnet.rs).
unicode-general-category = "1.1"
# The HTTP client of Rust's media transport in every build (http.rs: range, progressive and HLS streams, auth
# refresh), and of the debug download probe. rustls with bundled webpki roots, so it needs nothing from the app
# container's certificate store.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Rust's own IRandomAccessStream for the player (winrt_stream.rs), so playback reads never run managed code.
[target.'cfg(windows)'.dependencies]
# #[implement] expands to windows_core paths.
windows-core = "0.62.2"
windows-future = "0.3.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = ["Foundation", "Storage_Streams", "Win32_System_WinRT"]
