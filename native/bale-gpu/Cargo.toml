[package]
name = "bale-gpu"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Bale's native GPU/media layer for Xbox (C ABI for the C# app)"
publish = false

[lib]
name = "bale_gpu"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
# #[implement] expands to windows_core paths.
windows-core = "0.62.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Foundation",
    "Media_Core",
    "Media_Playback",
    "Media_MediaProperties",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    # Zero-copy repack; d3d12.dll is loaded by the caller, never imported.
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    # Zero-copy repack: D3D12/DXGI shared handles and events take SECURITY_ATTRIBUTES.
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Grain exports catch panics; unwinding must remain enabled, including in the shipped DLL.
panic = "unwind"

[dev-dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
